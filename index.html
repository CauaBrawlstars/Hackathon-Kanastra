<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antecipe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f2e22; --panel: #f4f6f1; --ink: #14291f; --muted: #5d7566;
    --lime: #c6f03c; --bar: #3a9150; --line: #dbe3da;
    --ok-bg: #d9f2a6; --ok-ink: #2c4a0a;
    --bad-bg: #ffe1dc; --bad-ink: #8a1c10; --bad-line: #f3b5ac;
    --head: #123a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px;
    font-family: Inter, system-ui, sans-serif; color: var(--ink);
    background: var(--bg);
  }
  .janela { max-width: 1060px; margin: 0 auto; border-radius: 22px; overflow: hidden; background: var(--panel); }
  .topo { background: var(--head); color: #e8f2ea; padding: 18px 22px; display: flex; align-items: center; gap: 14px; }
  .topo i { width: 12px; height: 12px; border-radius: 50%; background: #4b6b5a; display: inline-block; margin-right: 6px; }
  .corpo { padding: 26px 30px 34px; }

  .upload {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px;
    border: 2px dashed #5b9a6c; border-radius: 14px; cursor: pointer;
    font-size: 20px; transition: background .15s;
  }
  .upload:hover, .upload.arrastando, .upload:focus-visible { background: #e8efe6; outline: none; }
  .upload svg { flex: none; }
  .upload .nome { white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .trilho { flex: 1; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .trilho > div { height: 100%; width: 0; background: var(--bar); border-radius: 99px; transition: width .2s; }
  .upload .dica { color: var(--muted); font-size: 16px; }
  .upload.vazio .trilho { display: none; }
  .upload:not(.vazio) .dica { display: none; }

  table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 20px; }
  th { text-align: left; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; border-bottom: 2px solid var(--line); }
  td { padding: 14px 10px; border-bottom: 1px solid var(--line); }
  th.num, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }

  .selo { display: inline-block; padding: 3px 14px; border-radius: 99px; font-size: 17px; font-weight: 700; }
  .selo.aprovada { background: var(--ok-bg); color: var(--ok-ink); }
  .selo.recusada { background: var(--bad-bg); color: var(--bad-ink); border: 2px solid #3d4f44; }
  .selo.pendente { background: #e6e9e3; color: var(--muted); }

  .avisos { margin-top: 18px; display: grid; gap: 10px; }
  .aviso { padding: 14px 18px; border-radius: 12px; font-size: 18px; background: #fff0ed; border: 1px solid var(--bad-line); color: var(--bad-ink); }
  .resumo { margin-top: 16px; color: var(--muted); font-size: 16px; }
  .vazio-msg { margin-top: 22px; color: var(--muted); }
  .tabela-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main class="janela">
  <header class="topo">
    <span><i></i><i></i><i></i></span>
    <strong>Antecipe</strong>
  </header>

  <section class="corpo">
    <label class="upload vazio" id="zona" tabindex="0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span class="nome" id="nome">Selecionar lote de notas (.csv)</span>
      <span class="trilho"><div id="barra"></div></span>
      <span class="dica">ou arraste o arquivo para cá</span>
      <input type="file" id="arquivo" accept=".csv,text/csv" hidden>
    </label>

    <p class="vazio-msg" id="vazio">Nenhum lote carregado. Colunas esperadas: nota, sacado, vencimento, valor.</p>

    <div class="tabela-wrap" id="tabela-wrap" hidden>
      <table>
        <thead><tr><th>Nota</th><th>Sacado</th><th>Vencimento</th><th class="num">Valor</th><th>Status</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <div class="avisos" id="avisos"></div>
    <p class="resumo" id="resumo"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const zona = $("zona"), input = $("arquivo");
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 2 });
const rotulo = { aprovada: "Aprovada", recusada: "Recusada", pendente: "Pendente" };

input.addEventListener("change", () => input.files[0] && enviar(input.files[0]));
zona.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), input.click()));
["dragenter", "dragover"].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add("arrastando"); }));
["dragleave", "drop"].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.remove("arrastando"); }));
zona.addEventListener("drop", (e) => e.dataTransfer.files[0] && enviar(e.dataTransfer.files[0]));

function enviar(arquivo) {
  limpar();
  $("nome").textContent = arquivo.name;
  zona.classList.remove("vazio");
  const dados = new FormData();
  dados.append("file", arquivo);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/notas/upload");
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) $("barra").style.width = (e.loaded / e.total) * 90 + "%";
  };
  xhr.onload = () => {
    $("barra").style.width = "100%"; // servidor chegou ao EOF
    let corpo = {};
    try { corpo = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 200) mostrar(corpo);
    else erro(corpo.detail || "Não foi possível ler o arquivo.");
  };
  xhr.onerror = () => erro("Falha de conexão com o servidor.");
  xhr.send(dados);
}

function limpar() {
  $("barra").style.width = "0";
  $("linhas").replaceChildren();
  $("avisos").replaceChildren();
  $("resumo").textContent = "";
  $("tabela-wrap").hidden = true;
  $("vazio").hidden = true;
}

function aviso(texto) {
  const d = document.createElement("div");
  d.className = "aviso";
  d.textContent = texto;
  $("avisos").append(d);
}

function erro(msg) { aviso(msg); }

function mostrar({ notas, erros }) {
  const corpo = $("linhas");
  for (const n of notas) {
    const tr = document.createElement("tr");
    const celulas = [n.nota, n.sacado, `${n.vencimento} dias`, brl.format(n.valor)];
    celulas.forEach((t, i) => {
      const td = document.createElement("td");
      td.textContent = t;
      if (i === 3) td.className = "num";
      tr.append(td);
    });
    const td = document.createElement("td");
    const selo = document.createElement("span");
    selo.className = "selo " + n.status;
    selo.textContent = rotulo[n.status] || n.status;
    td.append(selo);
    tr.append(td);
    corpo.append(tr);
    if (n.status === "recusada" && n.motivo) aviso(n.motivo);
  }
  erros.forEach(aviso);
  $("tabela-wrap").hidden = notas.length === 0;
  const ap = notas.filter((n) => n.status === "aprovada").length;
  const re = notas.filter((n) => n.status === "recusada").length;
  $("resumo").textContent = `${notas.length} notas lidas · ${ap} aprovadas · ${re} recusadas`;
  input.value = "";
}
</script>
</body>
</html>
